<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QR Code Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 2rem;
      }
      form input,
      form button {
        margin: 0.5rem 0;
        padding: 0.5rem;
      }
      img {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>QR Code Generator</h1>
    <form method="POST">
      <input type="text" name="url" placeholder="Enter URL" required /><br />
      <input
        type="text"
        name="fill_color"
        placeholder="Foreground Color (e.g. brown)"
      /><br />
      <input
        type="text"
        name="back_color"
        placeholder="Background Color (e.g. #f5f5dc)"
      /><br />
      <button type="submit">Generate QR</button>
      <button type="reset">Reset</button>
    </form>

    {% if qr_filename %}
    <h2>Generated QR Code:</h2>
    <img
      src="{{ url_for('static', filename='qrcodes/' + qr_filename) }}"
      alt="QR Code"
      width="300"
    /><br />
    <a href="{{ url_for('download_file', filename=qr_filename) }}"
      >Download QR Code</a
    >
    {% endif %}
  </body>
</html>
